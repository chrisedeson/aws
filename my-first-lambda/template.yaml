AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  my-first-lambda

Globals:
  Function:
    Timeout: 3
    Runtime: python3.13
    Tracing: Active
  Api:
    TracingEnabled: true

Resources:
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: app.lambda_handler
      Architectures:
        - x86_64
      Events:
        HelloWorld:
          Type: Api
          Properties:
            Path: /hello
            Method: get

  AddServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: add-service-sam/add/
      Handler: app.lambda_handler
      Architectures:
        - x86_64
      Events:
        Sum:
          Type: Api
          Properties:
            Path: /sum
            Method: get

Outputs:
  HelloWorldApi:
    Description: API Gateway endpoint URL for Hello World function
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/hello/"

  HelloWorldFunction:
    Description: Hello World Lambda Function ARN
    Value: !GetAtt HelloWorldFunction.Arn

  HelloWorldFunctionIamRole:
    Description: Implicit IAM Role created for Hello World function
    Value: !GetAtt HelloWorldFunctionRole.Arn

  AddServiceFunction:
    Description: Add Service Lambda Function ARN
    Value: !GetAtt AddServiceFunction.Arn

  AddServiceFunctionIamRole:
    Description: Implicit IAM Role created for Add Service function
    Value: !GetAtt AddServiceFunctionRole.Arn
